<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sorting algorithm visualizer — random color grid"
    />
    <title>Sorting Visualizer</title>
    <link rel="icon" href="favicon_io/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io/apple-touch-icon.png"
    />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <!-- Shared theme from christophermpalmer.com: brand tokens (colours,
         type, spacing) and components (.btn, .page-title, ...). Updating the
         theme there updates this app too. When this app is hosted on the
         portfolio, the build points this link at its own copy. -->
    <link
      rel="stylesheet"
      href="https://christophermpalmer.com/shared/theme/v1/theme.css"
    />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1 class="page-title">Sorting Visualizer</h1>
        <p class="header__subtitle">Sort colors by hue</p>
      </header>

      <section class="controls" aria-label="Visualizer controls">
        <!-- One section, like the Pathfinding Visualizer's Terrain: two rows
             that line up with the two playback rows. -->
        <section class="controls__setup" aria-labelledby="setup-title">
          <h2 id="setup-title" class="section-title">Sort</h2>
          <div class="setup-rows">
            <div class="setup-row">
              <div class="setup-field">
                <span id="algorithm-label" class="setup-label">Algorithm</span>
                <div class="algo-picker">
                  <select
                    id="algorithm"
                    class="algo-picker__native"
                    tabindex="-1"
                    aria-hidden="true"
                  ></select>
                  <div class="algo-picker__anchor">
                    <button
                      type="button"
                      id="algorithm-trigger"
                      class="algo-picker__trigger select control__input control__input--select"
                      aria-labelledby="algorithm-label algorithm-trigger"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="algorithm-list"
                    ></button>
                    <ul
                      id="algorithm-list"
                      class="algo-picker__list popover"
                      role="listbox"
                      hidden
                    ></ul>
                  </div>
                  <span id="algorithm-measure" class="algorithm-measure" aria-hidden="true"></span>
                </div>
              </div>
              <div class="setup-field">
                <label class="setup-label" for="grid-cols">Grid</label>
                <input
                  id="grid-cols"
                  class="range grid-size-range"
                  type="range"
                  min="5"
                  max="100"
                  value="20"
                />
                <output id="grid-cols-value" class="grid-size-value" for="grid-cols"
                  >20</output
                >
              </div>
            </div>
            <div class="setup-row">
              <button
                id="shuffle"
                class="btn"
                type="button"
                aria-label="Shuffle colors"
              >
                Shuffle
              </button>
              <!-- A checkbox styled as a toggle button: navy while on. -->
              <label class="btn toggle-btn control--hue">
                <input
                  id="show-hue"
                  class="toggle-btn__input"
                  type="checkbox"
                  checked
                  aria-label="Show hue values on cells"
                />
                Values
              </label>
            </div>
          </div>
        </section>

        <p id="algorithm-description" class="controls__description"></p>

        <!-- Same layout as the Pathfinding Visualizer's playback: the slider,
             then play and speed centred beneath it. -->
        <section class="controls__playback" aria-labelledby="playback-title">
          <h2 id="playback-title" class="section-title">Playback</h2>
          <div class="playback-controls">
            <input
              id="playback"
              class="range playback-slider"
              type="range"
              min="0"
              max="0"
              value="0"
              disabled
              aria-label="Scrub through sort steps"
            />
            <div class="playback-buttons">
              <button
                id="play-toggle"
                class="btn btn--playback"
                type="button"
                data-playback="idle"
                aria-label="Start sorting"
                title="Start sorting"
              >
                <svg
                  class="btn__icon btn__icon--play"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path d="M8 5v14l11-7L8 5z" />
                </svg>
                <svg
                  class="btn__icon btn__icon--pause"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z" />
                </svg>
              </button>
              <select
                id="speed-preset"
                class="select playback-speed"
                aria-label="Playback speed"
              ></select>
              <output id="playback-value" class="playback-count" for="playback"
                >0 / 0</output
              >
            </div>
          </div>
        </section>
      </section>

      <main class="main">
        <div class="main__stage">
          <aside
            id="heap-tree-panel"
            class="heap-tree-panel"
            hidden
            aria-label="Heap tree view"
          >
            <canvas id="heap-tree-canvas" aria-hidden="true"></canvas>
          </aside>
          <aside
            id="quick-strip-panel"
            class="quick-strip-panel"
            hidden
            aria-label="Quick sort partition view"
          >
            <canvas id="quick-strip-canvas" aria-hidden="true"></canvas>
          </aside>
          <aside
            id="merge-panel"
            class="merge-panel"
            hidden
            aria-label="Merge sort runs view"
          >
            <canvas id="merge-panel-canvas" aria-hidden="true"></canvas>
          </aside>
          <aside
            id="tim-panel"
            class="tim-panel"
            hidden
            aria-label="Tim sort runs view"
          >
            <canvas id="tim-panel-canvas" aria-hidden="true"></canvas>
          </aside>
          <div class="canvas-container">
            <canvas id="canvas" aria-label="Color grid canvas"></canvas>
          </div>
          <aside
            id="tutorial-bar"
            class="tutorial-panel"
            hidden
            aria-live="polite"
          >
            <div class="tutorial-panel__meta">
              <span id="tutorial-tag" class="tutorial-panel__tag"></span>
              <span id="tutorial-step" class="tutorial-panel__step"></span>
            </div>
            <p id="tutorial-text" class="tutorial-panel__text"></p>
            <span class="tutorial-panel__hint"><kbd class="kbd">Space</kbd> next key step</span>
          </aside>
        </div>
        <p id="status" class="status" aria-live="polite">Loading…</p>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
